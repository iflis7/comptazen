services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: comptazen-frontend:local
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Hot-reloading dev server. Run with: docker compose --profile dev up dev
  # Kept behind a profile so a plain `docker compose up` still only builds
  # and starts the production `web` service (same host port otherwise).
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: comptazen-frontend:dev
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # Bind mounts don't always deliver native fs-change events across the
      # Docker Desktop VM boundary — polling makes hot reload reliable at
      # the cost of a bit of CPU. Remove if you find it isn't needed.
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
